[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imagedt"
version = "0.6.0rc1"
description = "Utilities for image processing, annotation, evaluation and model conversion"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "pytorch_fans11", email = "zhengyzms@163.com"}]
dependencies = ["numpy>=1.23", "Pillow>=10", "opencv-python-headless>=4.8", "lxml>=4.9"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/hanranCode/ImageDT"

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
excel = ["xlwt>=1.3"]
pdf = ["pypdfium2>=4.30"]
tensorflow = ["tensorflow>=2.16,<3", "protobuf>=4.25", "ai-edge-litert>=1.2"]
lite = ["ai-edge-litert>=1.2"]
caffe = ["protobuf>=4.25"]
dev = ["pytest>=8", "pytest-cov>=5", "build>=1", "twine>=5", "ruff>=0.17,<0.18", "setuptools>=77"]

[tool.setuptools.packages.find]
include = ["imagedt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["tensorflow: requires the TensorFlow extra", "integration: executes a real optional backend"]

[tool.coverage.run]
branch = true
source = ["imagedt"]
omit = ["*/caffe_pb2.py", "*/test_lenet.py"]

[tool.ruff]
target-version = "py310"
exclude = ["imagedt/converters/taffe/caffe/caffe_pb2.py"]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Optional backend must be skipped before importing backend-specific modules.
"tests/test_tensorflow.py" = ["E402"]
